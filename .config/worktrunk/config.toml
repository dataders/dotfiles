# Place worktrees as siblings of the repo directory
# e.g. /Users/dataders/Developer/fs.feature-auth
worktree-path = "{{ repo_path }}/../{{ repo }}.{{ branch | sanitize }}"

# Rename the cmux tab to "repo · branch" whenever wt switches worktrees.
[post-switch]
tab = "[ -n \"$CMUX_SURFACE_ID\" ] && cmux rename-tab \"{{ repo }} · {{ branch }}\" 2>/dev/null || true"

[projects."github.com/dbt-labs/fs"]
# Copy ignored warm-cache paths, then hydrate local bootstrap files that fs
# worktrees need before direnv/Conductor setup can run cleanly.
post-start.copy = "wt step copy-ignored; copy_status=$?; install -d .config .conductor; cp -a {{ primary_worktree_path }}/.envrc .envrc 2>/dev/null || true; cp -a {{ primary_worktree_path }}/.worktreeinclude .worktreeinclude 2>/dev/null || true; cp -a {{ primary_worktree_path }}/.config/wt.toml .config/wt.toml 2>/dev/null || true; cp -a {{ primary_worktree_path }}/.conductor/settings.local.toml .conductor/settings.local.toml 2>/dev/null || true; exit $copy_status"
post-start.cargo-profile = "rustup override set beta"
