# Codex CLI config for remote Linux hosts.
#
# This is a hand-picked portable subset of dotfiles/.codex/config.toml — the
# real file is full of macOS-only paths (Computer Use.app, ChatGPT.app's
# node_repl, per-project trust bookmarks, auto-generated marketplace/hooks
# cache) that don't exist on Linux and would break Codex startup if copied
# verbatim. mcp_servers here are limited to plain HTTPS endpoints; the
# local-script servers (community-slack, parallel-search, node_repl,
# computer-use) need the dotfiles repo and/or macOS apps present, so they're
# left out.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
UV_CACHE_DIR = "/tmp/uv-cache"

[features]
hooks = true
memories = true
terminal_resize_reflow = true
goals = true
chronicle = true

[mcp_servers.github]
url = "https://dbt.runlayer.com/api/v1/proxy/7e8a07e2-98ed-4c76-8edb-d8a68b55bccc/mcp"
bearer_token_env_var = "GITHUB_PAT_MCP"

[mcp_servers.notion-runlayer]
url = "https://dbt.runlayer.com/api/v1/proxy/24736211-1060-47e7-897e-fdf5a531a3d5/mcp"

[mcp_servers.slack]
url = "https://dbt.runlayer.com/api/v1/proxy/dcf3b868-a852-4758-97aa-024fb941a173/mcp"

