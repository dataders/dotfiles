# Codex CLI config for remote Linux hosts.
#
# This is a hand-picked portable subset of dotfiles/.codex/config.toml — the
# real file is full of macOS-only paths (Computer Use.app, ChatGPT.app's
# node_repl, per-project trust bookmarks, auto-generated marketplace/hooks
# cache) that don't exist on Linux and would break Codex startup if copied
# verbatim. mcp_servers here are limited to plain HTTPS endpoints; the
# local-script servers (community-slack, parallel-search, node_repl,
# computer-use) need the dotfiles repo and/or macOS apps present, so they're
# left out.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
UV_CACHE_DIR = "/tmp/uv-cache"

[features]
hooks = true
memories = true
terminal_resize_reflow = true
goals = true
chronicle = true

[mcp_servers.github]
url = "https://dbt.runlayer.com/api/v1/proxy/7e8a07e2-98ed-4c76-8edb-d8a68b55bccc/mcp"
bearer_token_env_var = "GITHUB_PAT_MCP"

[mcp_servers.notion-runlayer]
url = "https://dbt.runlayer.com/api/v1/proxy/24736211-1060-47e7-897e-fdf5a531a3d5/mcp"

[mcp_servers.slack]
url = "https://dbt.runlayer.com/api/v1/proxy/dcf3b868-a852-4758-97aa-024fb941a173/mcp"

[mcp_servers.dbt]
url = "https://dbt.runlayer.com/api/v1/proxy/404ba041-4eb4-4e29-a474-ae38e7899ac9/mcp"

[mcp_servers.grep]
url = "https://dbt.runlayer.com/api/v1/proxy/2af56970-3fbd-4f0b-9cd7-562e921c2c99/mcp"

[mcp_servers.salesforce]
url = "https://dbt.runlayer.com/api/v1/proxy/70b141cc-940c-4190-8da5-f9cd50d34923/mcp"

[mcp_servers.runlayer-docs]
url = "https://dbt.runlayer.com/api/v1/proxy/68a80158-1c82-4a97-b1aa-509703ad4b94/mcp"

[mcp_servers.google-sheets]
url = "https://dbt.runlayer.com/api/v1/proxy/ab3aadc4-d6ac-4d92-85d6-cfba5eafc0e1/mcp"

[mcp_servers.lucid]
url = "https://dbt.runlayer.com/api/v1/proxy/5bcab31b-de80-4be2-a8ea-553d8c365fea/mcp"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
]
status_line_use_colors = true

[notice]
fast_default_opt_out = true
