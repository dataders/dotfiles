# Source of truth for keeping extensions/settings consistent across Chrome
# profiles. bin/chrome-sync-check reads this file read-only and never
# writes to it or to Chrome's own state.
#
# See chrome/README.md and
# docs/superpowers/specs/2026-07-02-chrome-profile-sync-design.md for the
# full design and why this can't just be a synced Preferences file.

[profiles]
personal = "swanson.anders@gmail.com"
dbtlabs  = "anders.swanson@dbtlabs.com"
fivetran = "anders.swanson@fivetran.com"

# Add entries as you decide what should be synced, e.g.:
#
# [[extensions]]
# name = "uBlock Origin"
# id = "cjpalhdlnbpafiamejdnhcphjbkeiagm"
# profiles = ["personal", "dbtlabs", "fivetran"]
#
# [[settings]]
# name = "Always show bookmarks bar"
# pref_path = "bookmark_bar.show_on_all_tabs"
# value = true
# profiles = ["personal", "dbtlabs", "fivetran"]

# Extension internal-settings backups. Dark Reader, uBlock Origin Lite, and
# Privacy Badger have adequate native export features (see chrome/README.md)
# and aren't listed here -- their exported files are tracked directly, not
# generated by bin/chrome-extension-settings-export. Tab Wrangler and Reddit
# Enhancement Suite don't have a usable native export, so they're read via
# LevelDB instead; `keys` is an explicit allowlist (their raw storage mixes
# real settings with runtime/telemetry data).

[[extension_settings]]
name = "Tab Wrangler"
id = "egnjhciaieeiiohknchakcodbpgjnchh"
storage = "sync"
keys = [
  "maxTabs", "minTabs", "minutesInactive", "whitelist", "lockedIds",
  "lockedWindowIds", "paused", "filterAudio", "debounceOnActivated",
  "purgeClosedTabs", "showBadgeCount", "version",
]
profiles = ["personal", "dbtlabs", "fivetran"]

[[extension_settings]]
name = "Reddit Enhancement Suite"
id = "kbmfpngjjgdllneeigpgjifpgocmfgmb"
storage = "local"
keys = ["RESoptions.hover", "RESoptions.notifications"]
profiles = ["personal", "dbtlabs", "fivetran"]
