version: 2

sources:
  - name: shadowtraffic
    schema: shadowtraffic
    tables:
      - name: events
        description: Fake streaming commerce events generated by ShadowTraffic.
        columns:
          - name: event_id
            data_type: UUID
          - name: customer_id
            data_type: UUID
          - name: event_time
            data_type: DateTime64(3, 'UTC')
          - name: event_type
            data_type: LowCardinality(String)
          - name: amount
            data_type: Decimal(12, 2)
